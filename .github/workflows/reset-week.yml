name: Weekly balance reset

on:
  schedule:
    # Every 15 minutes, every day. This is nearly free to run this often —
    # the route only actually resets once (on the first check after Sunday
    # midnight America/New_York) and is a no-op the rest of the week, with
    # no external API calls involved.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

jobs:
  reset-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset-week endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/reset-week" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
