name: Weekly balance reset

on:
  # Scheduling moved to Vercel Cron (see vercel.json) — GitHub Actions'
  # scheduled triggers aren't guaranteed to fire on time and were drifting
  # by hours in practice, which pushed the actual reset hours later than
  # intended. This workflow is now manual-only, for debugging. The route
  # itself is still idempotent (a no-op except on the first check after
  # the Sunday-night/Monday boundary in America/New_York) so Vercel Cron's
  # schedule remains cheap and safe.
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

jobs:
  reset-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset-week endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/reset-week" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
