name: Sync live odds

on:
  # Scheduling moved to Vercel Cron (see vercel.json), which now calls
  # /api/sync/live every minute (looping internally ~25s apart for a
  # near-30s cadence) — GitHub Actions' scheduled triggers aren't
  # guaranteed to fire on time and were drifting by hours in practice.
  # This workflow is now manual-only, for debugging.
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync-live:
    runs-on: ubuntu-latest
    steps:
      - name: Call live sync endpoint once
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync/live" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
