name: Sync live odds

on:
  schedule:
    # Every 10 minutes. Only spends API credits on sports with a game
    # currently in progress — see README "Live betting" section for the
    # real cost this adds during active game windows, and how to tune it.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync-live:
    runs-on: ubuntu-latest
    steps:
      - name: Call live sync endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync/live" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
