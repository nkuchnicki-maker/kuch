name: Sync odds & scores

on:
  # Scheduling moved to Vercel Cron (see vercel.json) — GitHub Actions'
  # scheduled triggers aren't guaranteed to fire on time and were drifting
  # by hours in practice. This workflow is now manual-only, for debugging.
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
