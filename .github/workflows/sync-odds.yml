name: Sync odds & scores

on:
  schedule:
    # Twice a day. With 6 sports tracked, this already uses a meaningful
    # chunk of the free ~500 credit/month budget — see README "A note on
    # the free tier's request budget" before tightening this further.
    - cron: "0 12,20 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
