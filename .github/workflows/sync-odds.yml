name: Sync odds & scores

on:
  schedule:
    # Every 30 minutes. Adjust based on your The Odds API free-tier usage
    # (see README "Adding live odds" section) — e.g. change to "0 * * * *"
    # for hourly if you're burning through your monthly credit budget.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
