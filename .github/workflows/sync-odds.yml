name: Sync odds & scores

on:
  schedule:
    # Every 15 minutes. With a large Odds API credit budget this is cheap
    # (~34 credits/run, ~294k/month for all 6 sports + golf — see README "A
    # note on the free tier's request budget" for the math at other tiers).
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
